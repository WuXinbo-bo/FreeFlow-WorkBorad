name: CI

on:
  push:
    branches: [main, mac, win, 'codex/**']
  pull_request:
    branches: [main, mac, win]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prepare:desktop-build
      - name: Test with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - name: Test on the native desktop
        if: runner.os != 'Linux'
        run: npm test
