name: Validate plugin catalog
on:
  push:
    branches: [plugins]
  pull_request:
    branches: [plugins]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/validate-catalog.cjs --online
