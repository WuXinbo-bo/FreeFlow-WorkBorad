<template data-assistant-slot="header">

<template data-assistant-slot="history">
          <aside id="agent-history-panel" class="agent-history-panel is-hidden" aria-hidden="true">
            <div class="agent-history-head">
              <strong>会话</strong>
              <button id="agent-history-close-btn" class="agent-icon-button" type="button" title="关闭会话历史" aria-label="关闭会话历史">

              </button>
            </div>
            <label class="agent-history-search">
              <span class="sr-only">搜索会话</span>
              <input id="agent-history-search-input" type="search" placeholder="搜索会话" autocomplete="off" />
            </label>
            <div id="agent-history-list" class="agent-history-list"></div>
          </aside>


</template>

<template data-assistant-slot="composer">
          <section id="agent-queue-tray" class="agent-queue-tray is-hidden" aria-label="待发送消息" aria-live="polite"></section>

          <form id="chat-form" class="composer glass-inset ui-chrome-composer">
            <div class="composer-top">
              <div class="composer-input-shell">
                <div id="composer-attachments" class="composer-attachments is-hidden" aria-label="当前附件"></div>
                <textarea
                  id="prompt-input"
                  rows="1"
                  maxlength="12000"
                  placeholder="给 FreeFlow 发送消息..."
                ></textarea>
              </div>
            </div>

              <div class="composer-bar">
                <div class="agent-composer-tools">
                  <button id="agent-attach-btn" class="agent-icon-button" type="button" title="添加附件" aria-label="添加附件">
                    <svg class="app-icon" data-ui-icon="paperclip" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="--app-icon-size:18px" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg>
                  </button>
                  <input id="agent-file-input" type="file" multiple hidden />
                  <select id="agent-submit-mode" class="agent-submit-mode is-hidden" aria-label="运行中消息处理方式">
                    <option value="queue">排队发送</option>
                    <option value="steer">即时引导</option>
                  </select>
                  <span id="agent-composer-status" class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
                </div>
                <div class="composer-actions">
                  <button
                    id="composer-thinking-btn"
                    class="ghost-btn composer-thinking-btn is-hidden"
                    type="button"
                    aria-pressed="false"
                    aria-label="切换 Thinking"
                    title="切换 Thinking"
                  >
                    <span class="composer-thinking-icon" aria-hidden="true">
                      <svg class="app-icon" data-ui-icon="lightbulb" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="--app-icon-size:18px" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                    </span>
                  </button>
                  <button id="stop-btn" class="agent-icon-button is-stop" type="button" disabled title="停止" aria-label="停止">
                    <svg class="app-icon" data-ui-icon="square" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="--app-icon-size:18px" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                  </button>
                  <button id="send-btn" class="agent-icon-button is-primary" type="submit" title="发送" aria-label="发送">
                    <svg class="app-icon" data-ui-icon="send" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="--app-icon-size:18px" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
                  </button>
                </div>
              </div>
            </form>
</template>

<template data-assistant-slot="thread-controls">
            <button id="agent-scroll-bottom" class="agent-scroll-bottom is-hidden" type="button" title="回到底部" aria-label="回到底部">
              <svg class="app-icon" data-ui-icon="chevron-down" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" style="--app-icon-size:18px" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
              <span>回到底部</span>
